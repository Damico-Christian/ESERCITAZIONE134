<div class="movie-detail">
  <h2>{{ movie.title }}</h2>
  <img [src]="movie.posterUrl" alt="{{ movie.title }} poster" />
  <p><strong>Trama:</strong> {{ movie.plot }}</p>
  <p><strong>Cast:</strong> {{ movie.cast.join(', ') }}</p>
  <p><strong>Genere:</strong> {{ movie.genre.join(', ') }}</p>
  <p><strong>Anno:</strong> {{ movie.year }}</p>
  <p><strong>Rating:</strong> {{ movie.rating }}</p>
  
  <div class="actions">
    <button (click)="addToFavorites(movie)">Aggiungi ai Preferiti</button>
    <button (click)="addToWatchlist(movie)">Aggiungi alla Watchlist</button>
  </div>
</div>
