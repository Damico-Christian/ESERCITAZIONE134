<div class="favorites-container">
  <h2>I tuoi Film Preferiti</h2>
  <div *ngIf="favorites.length === 0">
    <p>Non hai ancora aggiunto film ai tuoi preferiti.</p>
  </div>
  <div *ngFor="let movie of favorites" class="favorite-movie-card">
    <h3>{{ movie.title }}</h3>
    <p>{{ movie.description }}</p>
    <button (click)="removeFromFavorites(movie)">Rimuovi dai Preferiti</button>
  </div>
</div>
